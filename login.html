<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main style="max-width:400px;margin:50px auto;background:#fff;padding:20px;border-radius:12px;box-shadow:1px 3px 10px rgba(0,0,0,0.1);">
    <h2>Đăng nhập</h2>
    <input id="username" type="text" placeholder="Tên người dùng" style="width:100%;padding:10px;margin-bottom:10px;">
    <input id="password" type="password" placeholder="Mật khẩu" style="width:100%;padding:10px;margin-bottom:10px;">
    <button id="loginBtn" style="width:100%;padding:10px;background:#0077cc;color:white;border:none;border-radius:8px;">Đăng nhập</button>
    <p style="margin-top:10px;">Chưa có tài khoản? <a href="register.html">Đăng ký</a></p>
  </main>

  <script type="module">
    import { auth } from "./firebase.js";
    import { signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-auth.js";
    
    document.getElementById("loginBtn").onclick = async () => {
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();
      if (!username || !password) return alert("Nhập đủ username và mật khẩu nha!");

      const fakeEmail = `${username}@mike.vn`;

      try {
        await signInWithEmailAndPassword(auth, fakeEmail, password);
        location.href = "index.html";
      } catch (err) {
        alert("Sai username hoặc mật khẩu!");
      }
    };
  </script>
</body>
</html>
