<!DOCTYPE html>
<html>
    <head>
        <title>MikeMinh</title>
        <style>
            .modernbt{
                background: linear-gradient(135deg, #00b4db, #0083b0);
                color: white;
                border: none;
                box-shadow: 1px 4px 10px rgba(0, 0, 0, 0.2);
                border-radius: 12px;
                transition: all 0.3s ease;
                padding: 1.5%;
                cursor: pointer;
            }
            .modernbt:hover{
                transform: scale(1.1);
                box-shadow: 0px 5px 10px rgb(136, 211, 255);
            }
            .background{
                background-color: rgb(245, 245, 245);
                border-radius: 12px;
                padding: 5px 10px;
                display: inline-block;
                box-shadow: 0px 5px 10px rgba(0, 0, 0, 0.2);
            }
        </style>
    </head>
    <body style="font-family: Arial; text-align: center;">
        <div>
            <h1 class="background"> Welcome to Mike Minh website! </h1>
            <br>
            <p class="background"> Click here to see my Youtube channel!</p>
            
        </div>
        <div>
            <a href="https://www.youtube.com/@dollarfamily8261" target="_blank">
                <button class="modernbt"> Here</button>
            </a>
        </div>
        
    </body>
    
</html>
