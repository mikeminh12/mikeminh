<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MikeMinh</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="logo">MikeMinh</div>
    <nav>
      <a href="index.html">Trang chủ</a>
      <a href="post.html">Bài đăng</a>
      <a href="about.html">Giới thiệu</a>
    </nav>
    <div id="user-actions">
      <button id="loginBtn">Đăng nhập</button>
      <button id="registerBtn">Đăng ký</button>
    </div>
  </header>

  <main>
    <section class="about">
      <h1>Chào mừng đến với MikeMinh!</h1>
      <p>Đây là nơi chia sẻ các bài viết, dự án và suy nghĩ cá nhân của mình.</p>
    </section>

    <section class="posts-section">
      <div class="section-header">
        <h2>Bài đăng gần đây</h2>
      </div>
      <div id="recent-posts" class="posts-grid"></div>
    </section>
  </main>

  <script type="module">
    import { auth, db } from "./firebase.js";
    import { collection, getDocs, query, orderBy, limit, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-firestore.js";
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-auth.js";

    const userActions = document.getElementById("user-actions");
    const loginBtn = document.getElementById("loginBtn");
    const registerBtn = document.getElementById("registerBtn");

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        const userDoc = await getDoc(doc(db, "users", user.uid));
        const username = userDoc.exists() ? userDoc.data().username : "User";

        userActions.innerHTML = `
          <span>Xin chào, <b>${username}</b></span>
          <button id="logoutBtn">Đăng xuất</button>
        `;

        document.getElementById("logoutBtn").onclick = async () => {
          await signOut(auth);
          location.reload();
        };
      } else {
        loginBtn.onclick = () => location.href = "login.html";
        registerBtn.onclick = () => location.href = "register.html";
      }
    });

    async function loadRecentPosts() {
      const postsContainer = document.getElementById("recent-posts");
      postsContainer.innerHTML = "<p>Đang tải bài đăng...</p>";

      try {
        const q = query(collection(db, "posts"), orderBy("createdAt", "desc"), limit(2));
        const querySnapshot = await getDocs(q);

        postsContainer.innerHTML = "";

        if (querySnapshot.empty) {
          postsContainer.innerHTML = "<p>Chưa có bài đăng nào.</p>";
          return;
        }

        querySnapshot.forEach((doc) => {
          const post = doc.data();
          const div = document.createElement("div");
          div.className = "post-card";
          div.innerHTML = `
            <h3>${post.title}</h3>
            <p>${post.description || "Không có mô tả."}</p>
            <button class="modernbt" onclick="location.href='post-detail.html?id=${doc.id}'">Xem chi tiết</button>
          `;
          postsContainer.appendChild(div);
        });
      } catch (err) {
        postsContainer.innerHTML = "<p>Lỗi khi tải bài đăng.</p>";
        console.error(err);
      }
    }

    loadRecentPosts();
  </script>
</body>
</html>
