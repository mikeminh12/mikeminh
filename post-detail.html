<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chi tiết bài đăng - MikeMinh</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="logo">MikeMinh</div>
    <nav>
      <a href="index.html">Trang chủ</a>
      <a href="post.html">Bài đăng</a>
      <a href="about.html">Giới thiệu</a>
    </nav>
    <div id="user-actions">
      <button id="loginBtn">Đăng nhập</button>
      <button id="registerBtn">Đăng ký</button>
    </div>
  </header>

  <main>
    <section class="about">
      <div id="post-container">
        <h2>Đang tải bài đăng...</h2>
      </div>

      <hr style="margin: 30px 0;">

      <div id="comment-section">
        <h3>Bình luận</h3>
        <div id="comments"></div>
        <div id="comment-form" style="margin-top:20px; display:none;">
          <textarea id="comment-input" placeholder="Nhập bình luận..." rows="3" style="width:100%; padding:10px; border-radius:10px; border:1px solid #ccc;"></textarea><br>
          <button id="sendCommentBtn" class="modernbt" style="margin-top:10px;">Gửi bình luận</button>
        </div>
        <p id="login-to-comment" style="color:gray;">Bạn cần đăng nhập để bình luận.</p>
      </div>
    </section>
  </main>

  <script type="module">
    import { auth, db } from "./firebase.js";
    import { doc, getDoc, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-firestore.js";
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-auth.js";

    const userActions = document.getElementById("user-actions");
    const loginBtn = document.getElementById("loginBtn");
    const registerBtn = document.getElementById("registerBtn");
    const postContainer = document.getElementById("post-container");
    const commentsDiv = document.getElementById("comments");
    const commentInput = document.getElementById("comment-input");
    const sendCommentBtn = document.getElementById("sendCommentBtn");
    const commentForm = document.getElementById("comment-form");
    const loginToComment = document.getElementById("login-to-comment");

    // --- Hiển thị trạng thái đăng nhập ---
    onAuthStateChanged(auth, (user) => {
      if (user) {
        userActions.innerHTML = `
          <span>Xin chào, <b>${user.email}</b></span>
          <button id="logoutBtn">Đăng xuất</button>
        `;
        document.getElementById("logoutBtn").onclick = async () => {
          await signOut(auth);
          location.reload();
        };

        loginToComment.style.display = "none";
        commentForm.style.display = "block";
      } else {
        loginBtn.onclick = () => location.href = "login.html";
        registerBtn.onclick = () => location.href = "register.html";
      }
    });

    // --- Lấy ID bài đăng ---
    const params = new URLSearchParams(window.location.search);
    const postId = params.get("id");

    // --- Tải bài đăng ---
    async function loadPost() {
      try {
        const docRef = doc(db, "posts", postId);
        const docSnap = await getDoc(docRef);

        if (!docSnap.exists()) {
          postContainer.innerHTML = "<h2>Không tìm thấy bài đăng!</h2>";
          return;
        }

        const post = docSnap.data();
        postContainer.innerHTML = `
          <div class="post-card">
            <h2>${post.title}</h2>
            <p><i>${post.description || "Không có mô tả."}</i></p>
            <p>${post.content || "Không có nội dung."}</p>
            <small>Người đăng: ${post.username || "Ẩn danh"} | Ngày: ${post.createdAt ? new Date(post.createdAt.toDate()).toLocaleString() : "Không rõ"}</small>
          </div>
        `;
      } catch (err) {
        console.error(err);
        postContainer.innerHTML = "<h2>Lỗi khi tải bài đăng.</h2>";
      }
    }

    // --- Hiển thị bình luận realtime ---
    function loadComments() {
      const q = query(collection(db, "comments"), orderBy("createdAt", "asc"));
      onSnapshot(q, (snapshot) => {
        commentsDiv.innerHTML = "";
        let hasComment = false;

        snapshot.forEach((doc) => {
          const comment = doc.data();
          if (comment.postId === postId) {
            hasComment = true;
            const div = document.createElement("div");
            div.className = "post-card";
            div.innerHTML = `
              <p>${comment.text}</p>
              <small>— ${comment.username || "Ẩn danh"}, ${comment.createdAt ? new Date(comment.createdAt.toDate()).toLocaleString() : ""}</small>
            `;
            commentsDiv.appendChild(div);
          }
        });

        if (!hasComment) commentsDiv.innerHTML = "<p>Chưa có bình luận nào.</p>";
      });
    }

    // --- Gửi bình luận ---
    sendCommentBtn.onclick = async () => {
      const user = auth.currentUser;
      if (!user) return alert("Bạn cần đăng nhập để bình luận!");
      const text = commentInput.value.trim();
      if (!text) return alert("Vui lòng nhập nội dung bình luận!");

      try {
        await addDoc(collection(db, "comments"), {
          postId,
          text,
          username: user.email,
          createdAt: serverTimestamp()
        });
        commentInput.value = "";
      } catch (err) {
        console.error(err);
        alert("Lỗi khi gửi bình luận.");
      }
    };

    loadPost();
    loadComments();
  </script>
</body>
</html>
