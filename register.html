<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng ký</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main style="max-width:400px;margin:50px auto;background:#fff;padding:20px;border-radius:12px;box-shadow:1px 3px 10px rgba(0,0,0,0.1);">
    <h2>Đăng ký</h2>
    <input id="email" type="email" placeholder="Email" style="width:100%;padding:10px;margin-bottom:10px;">
    <input id="password" type="password" placeholder="Mật khẩu" style="width:100%;padding:10px;margin-bottom:10px;">
    <button id="registerBtn" style="width:100%;padding:10px;background:#0077cc;color:white;border:none;border-radius:8px;">Tạo tài khoản</button>
    <p style="margin-top:10px;">Đã có tài khoản? <a href="login.html">Đăng nhập</a></p>
  </main>

  <script type="module">
    import { auth } from "./firebase.js";
    import { createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-auth.js";
    
    document.getElementById("registerBtn").onclick = async () => {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      try {
        await createUserWithEmailAndPassword(auth, email, password);
        alert("Đăng ký thành công!");
        location.href = "index.html";
      } catch (err) {
        alert("Lỗi đăng ký: " + err.message);
      }
    };
  </script>
</body>
</html>
