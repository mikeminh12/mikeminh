<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tất cả bài đăng - MikeMinh</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="logo">MikeMinh</div>
    <nav>
      <a href="index.html">Trang chủ</a>
      <a href="post.html">Bài đăng</a>
      <a href="about.html">Giới thiệu</a>
    </nav>
    <div id="user-actions">
      <button id="loginBtn">Đăng nhập</button>
      <button id="registerBtn">Đăng ký</button>
    </div>
  </header>

  <main>
    <section class="about">
      <div class="section-header">
        <h2>Tất cả bài đăng</h2>
        <button id="newPostBtn" class="modernbt" style="display:none;">+ Đăng bài</button>
      </div>
      <div id="posts-container" class="posts-grid"></div>
    </section>
  </main>

  <script type="module">
    import { auth, db } from "./firebase.js";
    import { collection, getDocs, query, orderBy, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-firestore.js";
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-auth.js";

    const userActions = document.getElementById("user-actions");
    const loginBtn = document.getElementById("loginBtn");
    const registerBtn = document.getElementById("registerBtn");
    const newPostBtn = document.getElementById("newPostBtn");

    // --- Kiểm tra đăng nhập + hiện "Xin chào, username" ---
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        try {
          const userDoc = await getDoc(doc(db, "users", user.uid));
          const username = userDoc.exists() ? userDoc.data().username : "Người dùng";

          userActions.innerHTML = `
            <span>Xin chào, <b>${username}</b></span>
            <button id="logoutBtn">Đăng xuất</button>
          `;

          document.getElementById("logoutBtn").onclick = async () => {
            await signOut(auth);
            location.reload();
          };

          newPostBtn.style.display = "inline-block";
          newPostBtn.onclick = () => location.href = "posting.html";
        } catch (err) {
          console.error("Lỗi lấy username:", err);
        }
      } else {
        loginBtn.onclick = () => location.href = "login.html";
        registerBtn.onclick = () => location.href = "register.html";
      }
    });

    // --- Load danh sách bài đăng ---
    async function loadPosts() {
      const postsContainer = document.getElementById("posts-container");
      postsContainer.innerHTML = "<p>Đang tải bài đăng...</p>";

      try {
        const q = query(collection(db, "posts"), orderBy("createdAt", "desc"));
        const querySnapshot = await getDocs(q);
        postsContainer.innerHTML = "";

        if (querySnapshot.empty) {
          postsContainer.innerHTML = "<p>Chưa có bài đăng nào.</p>";
          return;
        }

        querySnapshot.forEach((docSnap) => {
          const post = docSnap.data();
          const div = document.createElement("div");
          div.className = "post-card";
          div.innerHTML = `
            <h3>${post.title}</h3>
            <p>${post.description || "Không có mô tả."}</p>
            <small>Người đăng: ${post.authorName || "Ẩn danh"} | 
            Ngày: ${post.createdAt ? new Date(post.createdAt.toDate()).toLocaleString() : "Không rõ"}</small>
            <br><br>
            <button class="modernbt" onclick="location.href='post-detail.html?id=${docSnap.id}'">Xem chi tiết</button>
          `;
          postsContainer.appendChild(div);
        });
      } catch (err) {
        postsContainer.innerHTML = "<p>Lỗi khi tải bài đăng.</p>";
        console.error(err);
      }
    }

    loadPosts();
  </script>
</body>
</html>
